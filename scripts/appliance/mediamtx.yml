# MediaMTX on the Shiloh appliance — the broadcast relay.
#
# Second job for the same Mac mini that runs the assistant gateway: receive
# the phone's camera (golive.html publishes WebRTC/WHIP to this box) and fan
# it out to YouTube + Facebook over RTMP(S) with ffmpeg. This is what
# replaces a paid restreaming service — see docs/GO-LIVE.md, "Route D".
# Install/run/tunnel instructions: docs/APPLIANCE-SETUP.md, "The broadcast
# relay". MediaMTX treats this file as a partial config: only the settings
# that differ from its defaults are listed; everything else stays default.
#
# Three placeholders to fill in before first use, all ALL-CAPS below:
#   CHANGE-ME-TO-A-LONG-RANDOM-STRING  — the publish password staff phones use
#   YT_KEY / FB_KEY                    — the two persistent stream keys
#   YOURUSER                           — the Mac's account name, in recordPath
# (The commented multi-platform example further down adds optional TWITCH_KEY
# / KICK_KEY placeholders — only if you swap that line in; docs/MEDIA-SUITE.md.)

# ---------------------------------------------------------------------------
# Who may do what. Anyone may WATCH (that lets the app's Watch screen and the
# box's own player page at /live play with no login); only the one publisher
# account may BROADCAST. golive.html sends this login as HTTP Basic auth —
# it is typed once on each staff phone and lives in that phone's
# localStorage only, never in the app's data files.
# ---------------------------------------------------------------------------
authMethod: internal
authInternalUsers:
  # Anonymous viewers: read-only.
  - user: any
    pass:
    permissions:
      - action: read
      - action: playback

  # The single staff publisher login. CHANGE THE PASSWORD before exposing
  # this box through the tunnel — with the placeholder left in place, anyone
  # who reads this repo can broadcast as the church.
  - user: shiloh
    pass: CHANGE-ME-TO-A-LONG-RANDOM-STRING
    permissions:
      - action: publish
        path: live

  # MediaMTX's own API/metrics stay reachable from this box only.
  - user: any
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api
      - action: metrics
      - action: pprof

# ---------------------------------------------------------------------------
# WebRTC / WHIP listener (MediaMTX default port :8889). The phone publishes to
#   http://<this-box>:8889/live/whip           on the local network, or
#   https://stream.yourchurchdomain.org/live/whip   through the tunnel.
# The https form is the one that goes into data/live.json -> whip.url: the
# app is served over https, and a secure page cannot POST to plain http.
# Note the tunnel carries only the WHIP handshake — the video itself flows
# phone-to-box directly, which is why the broadcasting phone belongs on the
# church's Wi-Fi. To publish from OFF-site, forward UDP 8189 on the router
# to this box and advertise the public address here:
# webrtcAdditionalHosts: [broadcast.yourchurchdomain.org]
# ---------------------------------------------------------------------------
webrtcAddress: :8889

# ---------------------------------------------------------------------------
# The one broadcast path. The moment a phone starts publishing, ffmpeg pulls
# the stream back off this same MediaMTX (local RTSP — the $RTSP_PORT and
# $MTX_PATH below are filled in by MediaMTX) and pushes YouTube and Facebook
# simultaneously via the tee muxer. onfail=ignore keeps one destination
# alive if the other rejects its key.
#
# Paste the real keys over the placeholders:
#   YT_KEY — YouTube Live Control Room (youtube.com/livestreaming) -> "Stream key"
#   FB_KEY — facebook.com/live/producer -> "Persistent stream key"
#
# Codecs, honestly: -c:v copy assumes the phone sent H.264, which iPhones
# and most recent Androids negotiate. If a phone negotiated VP8 instead,
# RTMP can't carry it — swap "-c:v copy" for the Mac's hardware encoder:
#   -c:v h264_videotoolbox -b:v 4500k
# WebRTC audio always arrives as Opus, which RTMP can't carry either, so
# audio is unconditionally re-encoded to AAC below.
#
# GOING LIVE ON MORE PLATFORMS — docs/MEDIA-SUITE.md has the per-platform
# truth table (which are free, which are gated, which don't fit at all).
# Mechanically, each extra destination is one more |[f=flv:onfail=ignore]…
# segment in the tee. A 4-destination example (YouTube + Facebook + Twitch +
# Kick) — swap the runOnReady line below for this one and paste real keys
# over the ALL-CAPS placeholders, same CHANGE-ME convention as everywhere
# else in this file (TWITCH_KEY: Creator Dashboard -> Stream, needs 2FA on
# the account; KICK_KEY: Creator Dashboard -> Stream Key):
#
#   runOnReady: >
#     ffmpeg -rtsp_transport tcp -i rtsp://localhost:$RTSP_PORT/$MTX_PATH
#     -c:v copy -c:a aac -b:a 128k -map 0:v -map 0:a -f tee
#     "[f=flv:onfail=ignore]rtmp://a.rtmp.youtube.com/live2/YT_KEY|[f=flv:onfail=ignore]rtmps://live-api-s.facebook.com:443/rtmp/FB_KEY|[f=flv:onfail=ignore]rtmp://live.twitch.tv/app/TWITCH_KEY|[f=flv:onfail=ignore]rtmp://live.kick.com/app/KICK_KEY"
#
# The bandwidth math, honestly: the tee re-encodes nothing — it DUPLICATES
# the stream, so every destination is one full copy going up the church's
# internet connection. Four destinations of a ~4.5 Mbps broadcast is ~18 Mbps
# of steady upload; budget 20+ for headroom. Run a real speed test on the
# church's actual connection BEFORE adding tee segments (the phone->box leg
# rides the church Wi-Fi and costs no internet upload). If upload is thin,
# point ONE tee segment at a Restream-style service's RTMP ingest and let it
# fan out from their servers on their bandwidth — the box still owns ingest,
# recording, and the app's own player (plans priced in docs/GO-LIVE.md).
# ---------------------------------------------------------------------------
paths:
  live:
    runOnReady: >
      ffmpeg -rtsp_transport tcp -i rtsp://localhost:$RTSP_PORT/$MTX_PATH
      -c:v copy -c:a aac -b:a 128k -map 0:v -map 0:a -f tee
      "[f=flv:onfail=ignore]rtmp://a.rtmp.youtube.com/live2/YT_KEY|[f=flv:onfail=ignore]rtmps://live-api-s.facebook.com:443/rtmp/FB_KEY"
    # If ffmpeg exits (a destination hiccup, a mistyped key), start it again
    # for as long as the phone is still publishing.
    runOnReadyRestart: yes

    # -----------------------------------------------------------------------
    # Record the broadcast to disk while it happens — the video half of the
    # sermon archive (docs/SOUND-AND-SERVICE.md, "The service pipeline").
    # MediaMTX records ONLY while a stream is actually being published, so
    # this starts when the staff phone goes live and stops when it stops:
    # nothing is ever captured outside the broadcast itself. That boundary is
    # the privacy rule in SOUND-AND-SERVICE.md section 4, enforced here by
    # the mechanism rather than by memory.
    record: yes
    # Where the files land — the video/ branch of the ShilohSermons tree that
    # SOUND-AND-SERVICE.md lays out (audio + transcripts live beside it).
    # The date pattern becomes the filename (e.g. 2026-08-09_08-45-12-000000);
    # MediaMTX appends the .mp4 extension itself. Put the Mac's real account
    # name in place of YOURUSER — same placeholder habit as the plists in
    # docs/APPLIANCE-SETUP.md.
    recordPath: /Users/YOURUSER/ShilohSermons/video/%Y-%m-%d_%H-%M-%S-%f
    # Fragmented MP4: plays anywhere MP4 plays, and — unlike plain MP4 — the
    # file stays readable up to the last written fragment if the box loses
    # power mid-service.
    recordFormat: fmp4
    # One file per hour of broadcast; a normal Sunday service is 1-3 segments.
    recordSegmentDuration: 1h
    # Retention: keep 30 days, then delete automatically. The local video is
    # a safety net, not the archive — the broadcast already lands on YouTube/
    # Facebook, and the long-lived artifacts are the audio + transcript
    # (SOUND-AND-SERVICE.md). Disk math: a ~5 Mbps broadcast is roughly
    # 2.3 GB/hour, so ~2 hours x 5 Sundays stays around 25 GB — comfortable
    # on a 512GB mini. Set to 0s to keep everything forever (watch the disk).
    recordDeleteAfter: 30d
