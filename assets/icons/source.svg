<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Stained-glass window mark in the palette of Shiloh's own logo
       (shilohchurchbpt.org): four blue panes and a cross of light with an
       off-center intersection, echoing the site's window mark. A stand-in
       until the church's real vector art is available — see docs/MANAGE.md. -->
  <rect width="512" height="512" fill="#101f33"/>
  <defs>
    <!-- Window: arched top, rounded base -->
    <clipPath id="win">
      <path d="M136 208 C136 118 190 78 256 78 C322 78 376 118 376 208 L376 388 C376 412 356 430 332 430 L180 430 C156 430 136 412 136 388 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#win)">
    <!-- four panes, intersection off-center: vertical ~58%, horizontal ~40% -->
    <rect x="136" y="78"  width="140" height="140" fill="#a9c9ef"/>
    <rect x="276" y="78"  width="100" height="140" fill="#1d3a5c"/>
    <rect x="136" y="218" width="140" height="212" fill="#2e5f92"/>
    <rect x="276" y="218" width="100" height="212" fill="#7aa5d2"/>
    <!-- the cross of light -->
    <rect x="262" y="78"  width="30" height="352" fill="#f4f1e6"/>
    <rect x="136" y="196" width="240" height="30" fill="#f4f1e6"/>
  </g>
  <!-- leading around the window -->
  <path d="M136 208 C136 118 190 78 256 78 C322 78 376 118 376 208 L376 388 C376 412 356 430 332 430 L180 430 C156 430 136 412 136 388 Z"
        fill="none" stroke="#f4f1e6" stroke-width="14"/>
</svg>
